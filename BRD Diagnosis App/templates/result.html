<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detection Result</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='blood-drop.png') }}">
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      background: linear-gradient(135deg, #71b7e6, #9b59b6);
    }

    .container {
      max-width: 700px;
      width: 100%;
      background-color: #fff;
      padding: 25px 30px;
      border-radius: 5px;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    .title {
      font-size: 25px;
      font-weight: 500;
      margin-bottom: 20px;
      position: relative;
    }

    .title::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      height: 3px;
      width: 50px;
      border-radius: 5px;
      background: linear-gradient(135deg, #71b7e6, #9b59b6);
    }

    .result-section {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #f9f9f9;
      text-align: left;
    }

    .result-section h2 {
      margin-bottom: 10px;
      color: #9b59b6;
    }

    .result-section p {
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .disease-name {
      font-size: 22px;
      font-weight: 600;
      color: #333;
      text-align: center;
      margin-bottom: 15px;
    }

    .back-link {
      margin-top: 20px;
      text-align: center;
    }

    .back-link a {
      color: #9b59b6;
      text-decoration: none;
      font-weight: 500;
      margin: 0 10px;
    }

    .back-link a:hover {
      text-decoration: underline;
    }

  </style>
</head>
<body>

  <div class="container">
    <div class="title">Detection Result</div>
    <div class="result-section">
      
      <h2>Detected Disease:</h2>
      <p class="disease-name">{{ disease }}</p>

      <h2>Possible Cause & Information:</h2>
      <p class="disease-name">{{ cause }}</p>

    </div>

    <div class="back-link">
  <a href="{{ url_for('afterlogin') }}">Back to Detection</a> |
  <a href="{{ url_for('view_history') }}">View History</a>
    </div>


  </div>

</body>
</html>
